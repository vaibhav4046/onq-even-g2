<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OnQ - Even G2</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #000000;
        color: #34f57e;
        font-family: 'Courier New', Courier, monospace;
      }
      #g2-preview {
        width: 576px;
        height: 288px;
        background: #000000;
        border: 1px solid #1a261f;
        box-sizing: border-box;
        padding: 16px 20px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      pre {
        margin: 0;
        font-size: 16px;
        line-height: 1.45;
        white-space: pre;
      }
      .ring-wrap {
        display: flex;
        align-items: center;
        gap: 16px;
      }
      #ring-img {
        width: 76px;
        height: 76px;
        display: none;
        image-rendering: pixelated;
        filter: url(#g2-green-tint);
      }
    </style>
  </head>
  <body>
    <svg width="0" height="0" aria-hidden="true" style="position:absolute;pointer-events:none">
      <filter id="g2-green-tint" color-interpolation-filters="sRGB">
        <feColorMatrix type="matrix" values="0.204 0 0 0 0  0.961 0 0 0 0  0.494 0 0 0 0  0 0 0 1 0" />
      </filter>
    </svg>
    <div id="g2-preview">
      <div class="ring-wrap">
        <img id="ring-img" alt="OnQ 525nm monochrome green optical sprite" />
        <pre id="lens-text">ONQ | INITIALIZING...</pre>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
