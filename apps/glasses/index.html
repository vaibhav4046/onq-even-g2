<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OnQ - Even G2</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #000000;
        color: #34f57e;
        font-family: 'Courier New', Courier, monospace;
      }
      #g2-preview {
        width: 576px;
        height: 288px;
        background: #000000;
        border: 1px solid #1a261f;
        box-sizing: border-box;
        padding: 16px 20px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      pre {
        margin: 0;
        font-size: 16px;
        line-height: 1.45;
        white-space: pre;
      }
      .ring-wrap {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        width: 100%;
      }
      #lens-text {
        flex: 1;
        min-width: 0;
      }
      #g2-preview { max-width: 100%; }
      #link-status {
        margin: 8px 0 0;
        font-size: 14px;
        color: #f5c542;
        min-height: 1.2em;
      }
      #plain-controls {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        max-width: 576px;
        margin-top: 12px;
      }
      #plain-controls[hidden] { display: none; }
      #plain-controls button {
        min-height: 64px;
        font: inherit;
        font-size: 18px;
        color: #34f57e;
        background: #06110b;
        border: 1px solid #1a261f;
        border-radius: 8px;
        touch-action: manipulation;
      }
      #plain-controls button:active { background: #0e2a1a; }
      #pc-talk { grid-column: 1 / -1; min-height: 88px; }
      #ring-img {
        width: 76px;
        height: 76px;
        display: none;
        image-rendering: pixelated;
        filter: url(#g2-green-tint);
      }
    </style>
  </head>
  <body>
    <svg width="0" height="0" aria-hidden="true" style="position:absolute;pointer-events:none">
      <filter id="g2-green-tint" color-interpolation-filters="sRGB">
        <feColorMatrix type="matrix" values="0.204 0 0 0 0  0.961 0 0 0 0  0.494 0 0 0 0  0 0 0 1 0" />
      </filter>
    </svg>
    <div id="g2-preview">
      <div class="ring-wrap">
        <pre id="lens-text">ONQ | INITIALIZING...</pre>
        <img id="ring-img" alt="OnQ 525nm monochrome green optical sprite" />
      </div>
    </div>
    <p id="link-status" role="status" aria-live="polite"></p>
    <div id="plain-controls" hidden>
      <button id="pc-prev" type="button">Previous</button>
      <button id="pc-next" type="button">Next</button>
      <button id="pc-tap" type="button">Tap (select)</button>
      <button id="pc-back" type="button">Back</button>
      <button id="pc-talk" type="button">Hold to talk</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
